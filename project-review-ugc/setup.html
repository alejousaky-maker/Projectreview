<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Review · Setup</title><style>body{background:#f5f5f7;color:#1d1d1f;font:16px -apple-system,Arial;max-width:850px;margin:50px auto;padding:24px}section{background:white;padding:30px;border-radius:24px}table{border-collapse:collapse;width:100%}td{padding:14px;border-bottom:1px solid #eee}td:last-child{font-weight:600}a{color:#0071e3}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="/">← Creator studio</a><h1>Setup & status</h1><p>Secrets stay on the server. Manage your Pod and environment variables in the dashboard.</p><section><table id="status"></table><pre id="notes"></pre></section><script>
fetch('/setup/status').then(r=>{if(!r.ok)throw Error('Status unavailable');return r.json()}).then(s=>{const h=s.remote_worker;const rows={'GitHub code':'ready','RunPod URL':s.runpod_url_configured?'configured':'not configured','RunPod API key':s.runpod_api_key_configured?'configured':'not configured','Worker API key':s.worker_key_configured?'configured':'not configured','Remote worker':h.online?'online':'offline','GPU':h.gpu_name||'not detected','CUDA':h.cuda_available?'yes':'no','ElevenLabs':s.elevenlabs_configured?'configured':'not configured','Persona':h.online?(h.persona_ready?'ready':'incomplete'):(s.personas.some(p=>p.status==='ready')?'ready locally':'incomplete'),'Models':h.models_ready?'present':'missing','GPU lifecycle':s.gpu_lifecycle.state};for(const [k,v] of Object.entries(rows)){const tr=document.createElement('tr');for(const t of [k,v]){const td=document.createElement('td');td.textContent=t;tr.append(td)}document.getElementById('status').append(tr)}document.getElementById('notes').textContent=h.online?'Generation prerequisites: '+(h.prerequisites_ready?'present, real generation not yet verified':'incomplete')+'\n'+(h.missing||[]).join('\n'):h.error}).catch(e=>document.getElementById('notes').textContent=e.message);
</script></html>
