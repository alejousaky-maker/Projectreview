<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Review · Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:16px -apple-system,BlinkMacSystemFont,Arial}main{max-width:920px;margin:60px auto;padding:24px}small{color:#6e6e73}h1{font-size:44px;letter-spacing:-2px;margin-bottom:12px}section{background:white;border:1px solid #e5e5e8;border-radius:24px;padding:32px;margin:24px 0}form{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:grid;gap:8px;font-size:13px;font-weight:600}.wide{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:13px;border:1px solid #d2d2d7;border-radius:10px;background:white}button{background:#0071e3;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 monospace}video{max-width:320px;width:100%;border-radius:16px}progress{width:100%}@media(max-width:600px){form{grid-template-columns:1fr}.wide{grid-column:auto}main{margin:20px auto}h1{font-size:36px}}</style>
<main><small>PROJECT REVIEW / CREATOR STUDIO</small><h1>One idea. More trust.</h1><p>Turn your next review tip into a natural creator video.</p><section id="health">Checking your studio…</section><section><form id="form"><label class="wide">TOPIC<textarea name="topic" required minlength="3" placeholder="Why a bakery needs more Google reviews"></textarea></label><label>BUSINESS TYPE<select name="business_type" id="business"></select></label><label>UGC STYLE<select name="style" id="style"></select></label><label>TONE<select name="tone" id="tone"></select></label><label>DURATION<select name="duration"><option value="15">15 seconds</option><option value="20">20 seconds</option><option value="30">30 seconds</option></select></label><label>PERSONA<select name="persona"><option>project_review</option></select></label><label>OUTPUT MODE<select name="dry_run"><option value="false">Generate video</option><option value="true">Preview script only</option></select></label><label>CAPTIONS<select name="captions"><option value="false">Off</option><option value="true">Estimated timing</option></select></label><button class="wide" id="generate">Generate</button></form></section><section id="result" hidden><strong id="stage"></strong><progress id="progress" max="100"></progress><pre id="detail"></pre><video id="video" controls hidden></video></section><small>Video generation requires a configured NVIDIA backend and creator photo/voice. Script previews work without them.</small></main>
<script>
for(const [id,values] of Object.entries({business:['restaurant','bakery','auto shop','salon','dental','gym','retail','general local business'],style:['testimonial','founder style','customer reaction','educational','problem solution','POV','storytime'],tone:['casual','confident','funny','direct','friendly','skeptical-to-convinced']})){for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=value;document.getElementById(id).append(o)}}
fetch('/health').then(r=>r.json()).then(h=>{document.getElementById('health').textContent=h.backend.status==='setup_required'?'Controller ready · Video backend needs setup · '+h.persona.status:'Controller ready · '+h.backend.selected+' · '+h.persona.status}).catch(e=>document.getElementById('health').textContent=e.message);
const form=document.getElementById('form'),button=document.getElementById('generate');
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;document.getElementById('result').hidden=false;document.getElementById('video').hidden=true;try{const data=Object.fromEntries(new FormData(form));data.duration=Number(data.duration);data.dry_run=data.dry_run==='true';data.captions=data.captions==='true';const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const job=await r.json();if(!r.ok)throw Error(JSON.stringify(job.detail));while(true){const r=await fetch('/jobs/'+job.job_id);if(!r.ok)throw Error('Unable to read job');const state=await r.json();document.getElementById('stage').textContent=state.stage;document.getElementById('progress').value=state.progress;document.getElementById('detail').textContent=state.error?state.error.message:state.script?state.script.segments.join('\n\n'):state.status;if(state.status==='completed'){const video=document.getElementById('video');video.src=state.output_video;video.hidden=false;break}if(['failed','dry_run'].includes(state.status))break;await new Promise(r=>setTimeout(r,1500))}}catch(err){document.getElementById('detail').textContent=err.message}finally{button.disabled=false}};
</script></html>
